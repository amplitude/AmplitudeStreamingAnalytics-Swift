name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # -large, not plain macos-15: SwiftLint is preinstalled only on the Intel
    # image. The standard macos-15 label is arm64, which does not carry it.
    runs-on: macos-15-large
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint
        run: swiftlint --strict # force to fix warnings too
      - name: DelayedEvents extraction boundary
        run: |
          # grep exits 2 when the directory is missing, which `if` would read as "clean".
          test -d Sources/AmplitudeStreamingAnalytics/DelayedEvents || {
            echo "DelayedEvents/ is missing — this guard would pass without checking anything"; exit 1
          }
          if grep -rnE 'Player|Streaming' Sources/AmplitudeStreamingAnalytics/DelayedEvents/; then
            echo "DelayedEvents/ must not reference Player or Streaming types (extractability, design v3.1)"; exit 1
          fi
      - name: Version constant matches the release manifest
        run: |
          # release-please tags from the manifest and rewrites the constant from the
          # same number. Nothing else asserts they agree, and the tag is immutable
          # once cut, so a drift here ships a version that does not exist.
          manifest=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')
          constant=$(sed -n 's/.*static let version = "\([^"]*\)".*/\1/p' \
            Sources/AmplitudeStreamingAnalytics/StreamingAnalyticsInfo.swift)
          test -n "$constant" || {
            echo "no version constant found — the extra-files rewrite target moved"; exit 1
          }
          test "$manifest" = "$constant" || {
            echo "manifest $manifest != StreamingAnalyticsInfo.version $constant"; exit 1
          }
