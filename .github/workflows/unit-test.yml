name: Unit Test

on:
  pull_request:
  # No push trigger: on main this runs as release-please's `verify` job instead,
  # so the matrix gates the tag rather than racing it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-test:
    name: Unit ${{ matrix.platform }} - Xcode ${{ matrix.xcode }} - OS ${{ matrix.test-destination-os }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: macos-15
            platform: iOS
            xcode: 16.4
            device: "iPhone 16"
            test-destination-os: latest

          - runs-on: macos-15
            platform: macOS
            xcode: 16.4
            test-destination-os: latest

          - runs-on: macos-15
            platform: tvOS
            xcode: 16.4
            test-destination-os: latest
            device: "Apple TV"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -switch /Applications/Xcode_${{ matrix.xcode }}.app
      - name: Install Apple platform SDKs
        run: |
          # Warm up CoreSimulator to avoid "Unable to connect to simulator":
          # https://github.com/actions/runner-images/issues/12862#issuecomment-3239326872
          xcrun simctl list > /dev/null
          case "${{ matrix.platform }}" in
            iOS)
              sudo xcodebuild -downloadPlatform iOS
              ;;
            tvOS)
              sudo xcodebuild -downloadPlatform tvOS
              ;;
          esac
      - name: List Simulators
        run: |
          xcrun simctl list
      - name: List Project Configuration
        run: |
          xcodebuild -list
      - name: ${{ matrix.platform }} Tests
        run: |
          case "${{ matrix.platform }}" in
            iOS)
              xcodebuild test \
                -scheme AmplitudeStreamingAnalytics-Swift \
                -sdk iphonesimulator \
                -destination 'platform=iOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}'
              ;;
            macOS)
              swift test
              ;;
            tvOS)
              xcodebuild \
                -scheme AmplitudeStreamingAnalytics-Swift \
                -sdk appletvsimulator \
                -destination 'platform=tvOS Simulator,OS=${{ matrix.test-destination-os }},name=${{ matrix.device }}' \
                test
              ;;
          esac

  # Stable name for the branch ruleset to require. The matrix jobs interpolate
  # their names ("Unit iOS - Xcode 16.4 - OS latest"), so requiring those
  # directly would strand every PR on a check that no longer reports the day
  # the Xcode version or a platform changes.
  unit-tests-passed:
    name: Unit tests passed
    needs: unit-test
    # always(), or a failed matrix skips this job — and GitHub counts a skipped
    # required check as satisfied.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Matrix succeeded
        env:
          RESULT: ${{ needs.unit-test.result }}
        run: |
          test "$RESULT" = success || { echo "unit-test matrix: $RESULT"; exit 1; }
